name: Daily Horizon Summary

on:
  schedule:
    # 23:15 UTC is 07:15 Asia/Shanghai. The early start allows for
    # occasional GitHub scheduler delays before the morning briefing.
    - cron: '15 23 * * *'
  workflow_dispatch:

concurrency:
  group: horizon-daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare runtime configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_EMAIL_ADDRESS: ${{ secrets.HORIZON_EMAIL_ADDRESS }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY secret"; exit 1; }
          test -n "$HORIZON_EMAIL_ADDRESS" || { echo "Missing HORIZON_EMAIL_ADDRESS secret"; exit 1; }
          test -n "$QQ_EMAIL_AUTH_CODE" || { echo "Missing QQ_EMAIL_AUTH_CODE secret"; exit 1; }
          cp data/config.github.json data/config.json
          python -c "import json, os, pathlib; pathlib.Path('data/subscribers.json').write_text(json.dumps([os.environ['HORIZON_EMAIL_ADDRESS']], ensure_ascii=False, indent=2), encoding='utf-8')"

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_EMAIL_ADDRESS: ${{ secrets.HORIZON_EMAIL_ADDRESS }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
        run: uv run horizon --hours 24

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Horizon summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
